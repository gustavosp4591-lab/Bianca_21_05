<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDE8EF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F8D0DC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7D2B45;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A63D5A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="120" ry="120" fill="url(#bgGrad)"/>

  <!-- Subtle inner glow border -->
  <rect width="512" height="512" rx="120" ry="120" fill="none" stroke="#F0B8C8" stroke-width="6" opacity="0.6"/>

  <!-- G letter -->
  <text x="118" y="310"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="220"
    font-weight="700"
    fill="url(#textGrad)"
    text-anchor="middle"
    letter-spacing="-5">G</text>

  <!-- B letter -->
  <text x="394" y="310"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="220"
    font-weight="700"
    fill="url(#textGrad)"
    text-anchor="middle"
    letter-spacing="-5">B</text>

  <!-- Heart in the center -->
  <text x="256" y="300"
    font-family="Georgia, serif"
    font-size="88"
    fill="#D4617C"
    text-anchor="middle"
    opacity="0.9">♡</text>

  <!-- Small decorative dots -->
  <circle cx="256" cy="388" r="6" fill="#D4617C" opacity="0.5"/>
  <circle cx="236" cy="395" r="4" fill="#D4617C" opacity="0.35"/>
  <circle cx="276" cy="395" r="4" fill="#D4617C" opacity="0.35"/>
</svg>
